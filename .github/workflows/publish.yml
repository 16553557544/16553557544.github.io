name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch index.html from source repo
        env:
          SRC: https://raw.githubusercontent.com/16553557544/gomoku-online/main/index.html
        run: |
          curl -sSL --max-time 60 "$SRC" -o index.html
          sha=$(sha256sum index.html | awk '{print $1}')
          echo "sha256=$sha"
          test "$sha" = "32bb672a7210c1d78cd96a61647b1187ccfbc9278fc428e0aebca42a97d59471"

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "Publish gomoku page"
            git push
          fi
